site_name: headless-csms
site_description: A terminal charge point management system for one OCPP charging station, with a minimal OCPI 2.3.0 CPO interface.
site_url: https://wolffseb.github.io/headless-csms/
repo_url: https://github.com/wolffseb/headless-csms
repo_name: wolffseb/headless-csms
edit_uri: edit/main/docs/

# docs/ also holds working papers that are not part of the site.
exclude_docs: |
  /ROADMAP.md
  /IDEAS.md
  /merge-risk.md

theme:
  name: material
  icon:
    logo: material/ev-station
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Connect a real station: guides/connect-station.md
  - Guides:
      - Run a charging session: guides/charging-session.md
      - Test with the simulator: guides/simulator.md
      - Read power and current: guides/metering.md
      - Limit charging power: guides/smart-charging.md
      - Register an OCPI partner: guides/ocpi-partner.md
      - Push status to the partner: guides/ocpi-push.md
      - "Runbook: HYC50 limit while reserved": guides/hyc50-runbook.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - OCPI API: reference/ocpi-api.md
      - Probe report: reference/probe.md
      - Tested hardware: reference/hardware.md
  - Architecture:
      - Overview: architecture/overview.md
      - Sequences: architecture/sequences.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
